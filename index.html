<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Javier Tatay Rubio">
<meta name="description" content="Convierte vectores SVG de Illustrator en Slices de Resolume Arena. Sin instalación, directo en el navegador.">
<title>VectorSlice — SVG to Resolume Arena</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #1a1d1a;
  --surface:   #212421;
  --border:    #2e322e;
  --accent:    #4d9962;
  --accent-lt: #1e2b20;
  --accent-dk: #6abf7e;
  --muted:     #6b706b;
  --text:      #d8ddd8;
  --text-dim:  #8a908a;
  --danger:    #c0392b;
  --mono:      'JetBrains Mono', monospace;
  --sans:      'Inter', sans-serif;
  --radius:    4px;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  line-height: 1.5;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-mark svg { width: 14px; height: 14px; fill: white; }
.logo-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
.logo-sep  { color: var(--border); margin: 0 2px; }
.logo-sub  { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* MAIN */
main {
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.section-header {
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.section-title {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--muted);
}
.pill {
  font-family: var(--mono); font-size: 10px;
  padding: 2px 8px;
  background: var(--accent-lt); color: var(--accent-dk);
  border-radius: 10px; font-weight: 500;
}

/* DROP ZONE */
#dropzone {
  margin: 16px;
  border: 1.5px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  flex-shrink: 0;
}
#dropzone:hover, #dropzone.drag-over {
  border-color: var(--accent); background: var(--accent-lt);
}
.drop-icon { width: 28px; height: 28px; margin: 0 auto 10px; opacity: 0.25; }
.drop-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.drop-hint  { font-family: var(--mono); font-size: 10px; color: var(--muted); }
#file-input { display: none; }

/* SLICES LIST */
.slices-list {
  flex: 1; overflow-y: auto;
  padding: 8px 16px 16px;
}
.empty-msg {
  padding: 32px 0; text-align: center;
  color: var(--muted); font-size: 12px; line-height: 1.9;
}

/* SLICE ITEM */
.slice-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px;
  border-radius: var(--radius);
  margin-bottom: 2px;
  cursor: pointer;
  transition: background 0.1s;
  user-select: none;
}
.slice-item:hover  { background: var(--bg); }
.slice-item.active { background: var(--accent-lt); }
.slice-item.drag-src      { opacity: 0.35; }
.slice-item.drag-over-top { border-top: 2px solid var(--accent); }
.slice-item.drag-over-bot { border-bottom: 2px solid var(--accent); }

.drag-handle {
  color: var(--border); cursor: grab;
  font-size: 14px; line-height: 1;
  padding: 0 2px; flex-shrink: 0;
  transition: color 0.1s;
}
.slice-item:hover .drag-handle { color: var(--muted); }
.drag-handle:active { cursor: grabbing; }

.slice-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.slice-eye {
  background: none; border: none;
  cursor: pointer; font-size: 13px; line-height: 1;
  padding: 0 2px; flex-shrink: 0;
  transition: color 0.1s; opacity: 0;
  color: var(--muted);
}
.slice-item:hover .slice-eye,
.slice-item.active .slice-eye { opacity: 1; }
.slice-eye.eye-off { opacity: 1 !important; color: var(--danger) !important; }

.slice-info { flex: 1; min-width: 0; }

.slice-name {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slice-name-input {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--accent); border-radius: 2px;
  padding: 1px 5px; width: 100%; outline: none;
}
.slice-pts {
  font-family: var(--mono); font-size: 10px;
  color: var(--muted); margin-top: 1px;
}

.slice-del {
  background: none; border: none; color: var(--border);
  cursor: pointer; font-size: 16px; line-height: 1;
  padding: 0 3px; transition: color 0.1s;
  opacity: 0; flex-shrink: 0;
}
.slice-item:hover .slice-del { opacity: 1; }
.slice-del:hover { color: var(--danger); }

/* CONTENT */
.content { display: flex; flex-direction: column; overflow: hidden; }

/* PREVIEW */
.preview-area {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 32px; overflow: hidden;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  background-color: var(--bg);
  position: relative;
}
#preview-canvas { border-radius: var(--radius); box-shadow: 0 1px 8px rgba(0,0,0,0.07); display: block; }
.preview-empty { text-align: center; color: var(--muted); font-size: 12px; line-height: 2; }
.preview-empty svg { width: 36px; height: 36px; opacity: 0.15; display: block; margin: 0 auto 14px; }

#overlay-btn {
  position: absolute; top: 12px; right: 12px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--mono); font-size: 10px;
  padding: 4px 10px; border-radius: var(--radius);
  cursor: pointer; transition: all 0.15s; display: none;
}
#overlay-btn:hover { border-color: var(--accent); color: var(--accent-dk); }
#overlay-btn.active { border-color: var(--accent); color: var(--accent-dk); background: var(--accent-lt); }

/* OPTIONS BAR */
.options-bar {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 11px 24px;
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap; flex-shrink: 0;
}
.opt-group { display: flex; align-items: center; gap: 8px; }
.opt-label { font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; }

input[type="number"] {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 5px 8px; border-radius: var(--radius); width: 62px;
  transition: border-color 0.15s;
}
input[type="number"]:focus { outline: none; border-color: var(--accent); }

/* FOOTER */
footer {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 0 32px; height: 52px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.footer-left { display: flex; align-items: center; gap: 20px; flex: 1; min-width: 0; }
#status { font-family: var(--mono); font-size: 11px; color: var(--muted); }
#status.ok  { color: var(--accent-dk); }
#status.err { color: var(--danger); }

.footer-author {
  font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  white-space: nowrap; border: 1px solid var(--border);
  padding: 4px 10px; border-radius: var(--radius);
  text-decoration: none; transition: border-color 0.15s, color 0.15s;
}
.footer-author:hover { border-color: var(--accent); color: var(--accent-dk); }

.btn-row { display: flex; gap: 8px; flex-shrink: 0; }

button {
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  padding: 7px 16px; border-radius: var(--radius);
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s; line-height: 1;
}
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-dk); border-color: var(--accent-dk); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--muted); color: var(--text); }

/* EXPORT DROPDOWN */
.export-wrap { position: relative; }
.export-menu {
  display: none; position: absolute;
  bottom: calc(100% + 6px); right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  min-width: 200px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 100;
}
.export-menu.open { display: block; }
.export-opt {
  display: block; width: 100%; text-align: left;
  padding: 10px 14px; background: none; border: none; border-radius: 0;
  color: var(--text); font-size: 12px; cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.export-opt:last-child { border-bottom: none; }
.export-opt:hover { background: var(--accent-lt); color: var(--accent-dk); }
.export-opt-sub {
  display: block; font-family: var(--mono); font-size: 10px;
  color: var(--muted); margin-top: 2px;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

@media (max-width: 700px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 42vh; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9l3 3-3 3V9z"/></svg>
    </div>
    <span class="logo-name">VectorSlice</span>
    <span class="logo-sep">·</span>
    <span class="logo-sub">SVG → Resolume Arena</span>
  </div>
</header>

<main>
  <div class="sidebar">
    <div class="section-header">
      <span class="section-title">Slices</span>
      <span class="pill" id="count-pill">0</span>
    </div>

    <div id="dropzone" onclick="document.getElementById('file-input').click()">
      <svg class="drop-icon" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 4v16M8 14l6 6 6-6M4 24h20" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="drop-title">Arrastra el SVG aquí</div>
      <div class="drop-hint">o haz click para seleccionar</div>
    </div>
    <input type="file" id="file-input" accept=".svg">

    <div class="slices-list" id="slices-list">
      <div class="empty-msg">Importa un SVG para<br>ver los slices detectados</div>
    </div>
  </div>

  <div class="content">
    <div class="section-header" style="background:var(--surface);">
      <span class="section-title">Preview</span>
      <span class="pill" id="preview-dim">—</span>
    </div>

    <div class="preview-area" id="preview-area">
      <div class="preview-empty">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="4" y="4" width="14" height="14" rx="1"/>
          <rect x="22" y="4" width="14" height="14" rx="1"/>
          <rect x="4" y="22" width="14" height="14" rx="1"/>
          <path d="M22 29h14M29 22v14" stroke-linecap="round"/>
        </svg>
        El preview aparecerá aquí<br>tras importar un SVG
      </div>
      <button id="overlay-btn" onclick="toggleOverlay()">Overlay res.</button>
    </div>

    <div class="options-bar">
      <div class="opt-group">
        <span class="opt-label">Subdivisión de curvas</span>
        <input type="number" id="opt-sub" value="8" min="2" max="32">
      </div>
      <div class="opt-group">
        <span class="opt-label">Resolución de salida</span>
        <input type="number" id="opt-w" value="1920" min="1">
        <span class="opt-label">×</span>
        <input type="number" id="opt-h" value="1080" min="1">
        <span class="opt-label">px</span>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-left">
    <div id="status">Importa un SVG para comenzar.</div>
    <a class="footer-author" href="https://javitatay.github.io" target="_blank">javitatay.github.io</a>
  </div>
  <div class="btn-row">
    <button class="btn-ghost" onclick="clearAll()">Limpiar</button>
    <div class="export-wrap">
      <button class="btn-primary" id="btn-export" onclick="toggleExportMenu()" disabled>Exportar ▾</button>
      <div class="export-menu" id="export-menu">
        <button class="export-opt" onclick="doExport('screensetup')">
          Screen Setup XML
          <span class="export-opt-sub">Advanced Output → Import Layout</span>
        </button>
        <button class="export-opt" onclick="doExport('composition')">
          Composition Preset XML
          <span class="export-opt-sub">Composición → preset de pantalla</span>
        </button>
      </div>
    </div>
  </div>
</footer>

<script>
// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let slices      = [];
let svgVB       = { x:0, y:0, w:1920, h:1080 };
let svgFileName = 'vectorslice';
let activeIdx   = -1;
let showOverlay = false;

const PALETTE = [
  '#3d7a4e','#2c8a5a','#4a9465','#1f6b42',
  '#5aac7a','#327a58','#6bbf8a','#256647',
  '#3d8c60','#4fa070','#28724e','#57b07d'
];

// ══════════════════════════════════════════════
//  DROP / FILE
// ══════════════════════════════════════════════
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');

dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fi.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  if (!file.name.toLowerCase().endsWith('.svg')) {
    setStatus('Solo se aceptan archivos .svg', 'err'); return;
  }
  svgFileName = file.name.replace(/\.svg$/i, '');
  const r = new FileReader();
  r.onload = e => parseSVG(e.target.result);
  r.readAsText(file);
}

// ══════════════════════════════════════════════
//  PARSE SVG
// ══════════════════════════════════════════════
function parseSVG(text) {
  const doc   = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svgEl = doc.querySelector('svg');
  if (!svgEl) { setStatus('SVG inválido.', 'err'); return; }

  const vb = svgEl.getAttribute('viewBox');
  if (vb) {
    const p = vb.trim().split(/[\s,]+/).map(Number);
    if (p.length === 4) svgVB = { x:p[0], y:p[1], w:p[2], h:p[3] };
  } else {
    svgVB.w = parseFloat(svgEl.getAttribute('width'))  || 1920;
    svgVB.h = parseFloat(svgEl.getAttribute('height')) || 1080;
  }
  document.getElementById('opt-w').value = Math.round(svgVB.w);
  document.getElementById('opt-h').value = Math.round(svgVB.h);

  slices = []; let idx = 0;
  doc.querySelectorAll('path,rect,polygon,polyline,ellipse,circle').forEach(el => {
    const pts = extractPoints(el);
    if (pts && pts.length >= 3) {
      slices.push({
        id: idx,
        name: getName(el, idx),
        points: pts,
        color: PALETTE[idx % PALETTE.length],
        visible: true
      });
      idx++;
    }
  });

  if (!slices.length) { setStatus('No se encontraron shapes válidos.', 'err'); return; }
  activeIdx = -1;
  setStatus(`${slices.length} slice${slices.length!==1?'s':''} detectados.`, 'ok');
  renderList(); renderPreview();
  document.getElementById('btn-export').disabled = false;
  document.getElementById('overlay-btn').style.display = 'block';
}

function getName(el, i) {
  const raw = el.getAttribute('id')
    || el.getAttribute('inkscape:label')
    || el.getAttribute('data-name')
    || el.getAttribute('class')?.split(' ')[0]
    || '';
  return sanitize(raw, i);
}

// ══════════════════════════════════════════════
//  EXTRACT POINTS
// ══════════════════════════════════════════════
function extractPoints(el) {
  const tag  = el.tagName.toLowerCase();
  const subs = parseInt(document.getElementById('opt-sub').value) || 8;
  if (tag==='rect') {
    const x=+el.getAttribute('x')||0, y=+el.getAttribute('y')||0;
    const w=+el.getAttribute('width')||0, h=+el.getAttribute('height')||0;
    const rx=+el.getAttribute('rx')||0;
    if (w<=0||h<=0) return null;
    if (rx>0) return rectRounded(x,y,w,h,rx,subs);
    return [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}];
  }
  if (tag==='circle') {
    const cx=+el.getAttribute('cx')||0, cy=+el.getAttribute('cy')||0, r=+el.getAttribute('r')||0;
    return ellipsePts(cx,cy,r,r,subs*4);
  }
  if (tag==='ellipse') {
    const cx=+el.getAttribute('cx')||0, cy=+el.getAttribute('cy')||0;
    const rx=+el.getAttribute('rx')||0, ry=+el.getAttribute('ry')||0;
    return ellipsePts(cx,cy,rx,ry,subs*4);
  }
  if (tag==='polygon'||tag==='polyline') return parsePoly(el.getAttribute('points')||'');
  if (tag==='path') return parsePath(el.getAttribute('d')||'', subs);
  return null;
}
function rectRounded(x,y,w,h,r,subs){
  const pts=[],n=Math.max(4,subs);
  const arc=(cx,cy,a0,a1)=>{for(let i=0;i<=n;i++){const a=a0+(a1-a0)*(i/n);pts.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)});}};
  arc(x+r,y+r,Math.PI,Math.PI*1.5); arc(x+w-r,y+r,Math.PI*1.5,Math.PI*2);
  arc(x+w-r,y+h-r,0,Math.PI*.5); arc(x+r,y+h-r,Math.PI*.5,Math.PI);
  return pts;
}
function ellipsePts(cx,cy,rx,ry,n){
  const pts=[];
  for(let i=0;i<n;i++){const a=(2*Math.PI*i)/n;pts.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)});}
  return pts;
}
function parsePoly(str){
  const n=str.trim().split(/[\s,]+/).map(Number),p=[];
  for(let i=0;i+1<n.length;i+=2)p.push({x:n[i],y:n[i+1]});
  return p.length>=3?p:null;
}
function parsePath(d,subs){
  const pts=[];
  let cx=0,cy=0,mx=0,my=0,lc=null;
  const tk=d.match(/[MmZzLlHhVvCcSsQqTt]|[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[];
  let i=0,cmd='M';
  const get=n=>{const r=[];for(let k=0;k<n;k++)r.push(parseFloat(tk[i++]||0));return r;};
  while(i<tk.length){
    if(/[MmZzLlHhVvCcSsQqTt]/.test(tk[i])){cmd=tk[i++];}
    switch(cmd){
      case 'M':{const[x,y]=get(2);cx=x;cy=y;mx=x;my=y;pts.push({x,y});cmd='L';break;}
      case 'm':{const[dx,dy]=get(2);cx+=dx;cy+=dy;mx=cx;my=cy;pts.push({x:cx,y:cy});cmd='l';break;}
      case 'L':{const[x,y]=get(2);cx=x;cy=y;pts.push({x,y});break;}
      case 'l':{const[dx,dy]=get(2);cx+=dx;cy+=dy;pts.push({x:cx,y:cy});break;}
      case 'H':{const[x]=get(1);cx=x;pts.push({x:cx,y:cy});break;}
      case 'h':{const[dx]=get(1);cx+=dx;pts.push({x:cx,y:cy});break;}
      case 'V':{const[y]=get(1);cy=y;pts.push({x:cx,y:cy});break;}
      case 'v':{const[dy]=get(1);cy+=dy;pts.push({x:cx,y:cy});break;}
      case 'Z':case 'z':cx=mx;cy=my;i++;break;
      case 'C':{const[x1,y1,x2,y2,x,y]=get(6);cubicB({x:cx,y:cy},{x:x1,y:y1},{x:x2,y:y2},{x,y},subs).forEach(p=>pts.push(p));lc={x:x2,y:y2};cx=x;cy=y;break;}
      case 'c':{const[dx1,dy1,dx2,dy2,dx,dy]=get(6);cubicB({x:cx,y:cy},{x:cx+dx1,y:cy+dy1},{x:cx+dx2,y:cy+dy2},{x:cx+dx,y:cy+dy},subs).forEach(p=>pts.push(p));lc={x:cx+dx2,y:cy+dy2};cx+=dx;cy+=dy;break;}
      case 'S':{const[x2,y2,x,y]=get(4);const c1=lc?{x:2*cx-lc.x,y:2*cy-lc.y}:{x:cx,y:cy};cubicB({x:cx,y:cy},c1,{x:x2,y:y2},{x,y},subs).forEach(p=>pts.push(p));lc={x:x2,y:y2};cx=x;cy=y;break;}
      case 's':{const[dx2,dy2,dx,dy]=get(4);const c1=lc?{x:2*cx-lc.x,y:2*cy-lc.y}:{x:cx,y:cy};cubicB({x:cx,y:cy},c1,{x:cx+dx2,y:cy+dy2},{x:cx+dx,y:cy+dy},subs).forEach(p=>pts.push(p));lc={x:cx+dx2,y:cy+dy2};cx+=dx;cy+=dy;break;}
      case 'Q':{const[x1,y1,x,y]=get(4);quadB({x:cx,y:cy},{x:x1,y:y1},{x,y},subs).forEach(p=>pts.push(p));cx=x;cy=y;break;}
      case 'q':{const[dx1,dy1,dx,dy]=get(4);quadB({x:cx,y:cy},{x:cx+dx1,y:cy+dy1},{x:cx+dx,y:cy+dy},subs).forEach(p=>pts.push(p));cx+=dx;cy+=dy;break;}
      default:i++;
    }
  }
  return pts.length>=3?pts:null;
}
function cubicB(p0,p1,p2,p3,n){const r=[];for(let i=1;i<=n;i++){const t=i/n,m=1-t;r.push({x:m**3*p0.x+3*m**2*t*p1.x+3*m*t**2*p2.x+t**3*p3.x,y:m**3*p0.y+3*m**2*t*p1.y+3*m*t**2*p2.y+t**3*p3.y});}return r;}
function quadB(p0,p1,p2,n){const r=[];for(let i=1;i<=n;i++){const t=i/n,m=1-t;r.push({x:m**2*p0.x+2*m*t*p1.x+t**2*p2.x,y:m**2*p0.y+2*m*t*p1.y+t**2*p2.y});}return r;}

// ══════════════════════════════════════════════
//  RENDER LIST
// ══════════════════════════════════════════════
let dragSrcIdx = null;

function renderList() {
  const list = document.getElementById('slices-list');
  document.getElementById('count-pill').textContent = slices.length;
  if (!slices.length) {
    list.innerHTML = '<div class="empty-msg">Importa un SVG para<br>ver los slices detectados</div>';
    return;
  }
  list.innerHTML = slices.map((s, i) => `
    <div class="slice-item${activeIdx===i?' active':''}"
         data-idx="${i}" draggable="true"
         onclick="handleItemClick(event,${i})">
      <span class="drag-handle" title="Reordenar">⠿</span>
      <div class="slice-dot" style="background:${s.color};opacity:${s.visible?1:0.3}"></div>
      <div class="slice-info">
        <div class="slice-name" ondblclick="startRename(event,${i})"
             style="opacity:${s.visible?1:0.4}">${esc(s.name)}</div>
        <div class="slice-pts">${s.points.length} puntos</div>
      </div>
      <button class="slice-eye${!s.visible?' eye-off':''}"
              title="${s.visible?'Ocultar':'Mostrar'}"
              onclick="toggleVisible(event,${i})">${s.visible?'◉':'○'}</button>
      <button class="slice-del" onclick="removeSlice(event,${i})">×</button>
    </div>`).join('');

  list.querySelectorAll('.slice-item').forEach(el => {
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragover',  onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop',      onDrop);
    el.addEventListener('dragend',   onDragEnd);
  });
}

function handleItemClick(e, i) {
  if (['slice-del','slice-eye','drag-handle','slice-name-input']
      .some(c => e.target.classList.contains(c))) return;
  activeIdx = (activeIdx === i) ? -1 : i;
  renderList(); renderPreview();
}

// ── Drag & Drop ──
function onDragStart(e) {
  dragSrcIdx = +e.currentTarget.dataset.idx;
  setTimeout(() => e.currentTarget.classList.add('drag-src'), 0);
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) {
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const mid  = rect.top + rect.height / 2;
  el.classList.remove('drag-over-top','drag-over-bot');
  el.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bot');
}
function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-top','drag-over-bot');
}
function onDrop(e) {
  e.preventDefault();
  const targetIdx = +e.currentTarget.dataset.idx;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  e.currentTarget.classList.remove('drag-over-top','drag-over-bot');
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
  const moved = slices.splice(dragSrcIdx, 1)[0];
  let insertAt = targetIdx > dragSrcIdx ? targetIdx - 1 : targetIdx;
  if (!before) insertAt++;
  slices.splice(Math.min(insertAt, slices.length), 0, moved);
  activeIdx = slices.indexOf(moved);
  renderList(); renderPreview();
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('drag-src','drag-over-top','drag-over-bot');
  dragSrcIdx = null;
  document.querySelectorAll('.drag-over-top,.drag-over-bot').forEach(el =>
    el.classList.remove('drag-over-top','drag-over-bot'));
}

// ── Inline Rename ──
function startRename(e, i) {
  e.stopPropagation();
  const nameEl  = e.currentTarget;
  const current = slices[i].name;
  const input   = document.createElement('input');
  input.className = 'slice-name-input';
  input.value = current;
  nameEl.replaceWith(input);
  input.focus(); input.select();
  const commit = () => {
    slices[i].name = sanitize(input.value.trim(), i) || current;
    renderList(); renderPreview();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  input.blur();
    if (ev.key === 'Escape') { input.value = current; input.blur(); }
    ev.stopPropagation();
  });
}

// ── Visibility ──
function toggleVisible(e, i) {
  e.stopPropagation();
  slices[i].visible = !slices[i].visible;
  renderList(); renderPreview();
}

// ══════════════════════════════════════════════
//  RENDER PREVIEW
// ══════════════════════════════════════════════
function renderPreview() {
  const area = document.getElementById('preview-area');

  if (!slices.length) {
    area.innerHTML = `<div class="preview-empty">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="4" y="4" width="14" height="14" rx="1"/>
        <rect x="22" y="4" width="14" height="14" rx="1"/>
        <rect x="4" y="22" width="14" height="14" rx="1"/>
        <path d="M22 29h14M29 22v14" stroke-linecap="round"/>
      </svg>
      El preview aparecerá aquí<br>tras importar un SVG</div>
    <button id="overlay-btn" onclick="toggleOverlay()">Overlay res.</button>`;
    document.getElementById('preview-dim').textContent = '—';
    return;
  }

  // bounding box de todos los slices
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  slices.forEach(s => s.points.forEach(p => {
    minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y);
  }));
  const dW=maxX-minX||1, dH=maxY-minY||1;
  const aW=area.clientWidth-64, aH=area.clientHeight-64;
  const sc = Math.min(aW/dW, aH/dH) * 0.95;
  const cW = Math.round(dW*sc), cH = Math.round(dH*sc);

  // mantener el canvas si ya existe
  let canvas = document.getElementById('preview-canvas');
  const hadCanvas = !!canvas;
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'preview-canvas'; }
  canvas.width = cW; canvas.height = cH;

  if (!hadCanvas) {
    area.innerHTML = '';
    area.appendChild(canvas);
    const obtn = document.createElement('button');
    obtn.id = 'overlay-btn'; obtn.textContent = 'Overlay res.';
    obtn.style.display = 'block';
    obtn.onclick = toggleOverlay;
    area.appendChild(obtn);
  }
  // sync overlay button state
  const obtn = document.getElementById('overlay-btn');
  if (obtn) { obtn.style.display = 'block'; obtn.className = showOverlay ? 'active' : ''; }

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#212421'; ctx.fillRect(0,0,cW,cH);

  // ── draw slices ──
  slices.forEach((s, i) => {
    if (!s.visible) return;
    const isActive = (i === activeIdx);
    ctx.beginPath();
    s.points.forEach((p, j) => {
      const sx=(p.x-minX)*sc, sy=(p.y-minY)*sc;
      j===0 ? ctx.moveTo(sx,sy) : ctx.lineTo(sx,sy);
    });
    ctx.closePath();
    ctx.fillStyle   = s.color + (isActive ? '55' : '28');
    ctx.strokeStyle = s.color;
    ctx.lineWidth   = isActive ? 2 : 1.5;
    ctx.fill(); ctx.stroke();

    // label
    const lcx = s.points.reduce((a,p)=>a+p.x,0)/s.points.length;
    const lcy = s.points.reduce((a,p)=>a+p.y,0)/s.points.length;
    ctx.fillStyle = s.color;
    ctx.font = `500 10px 'JetBrains Mono',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.name, (lcx-minX)*sc, (lcy-minY)*sc);
  });

  // draw hidden slices faded (so you know they exist)
  slices.forEach((s) => {
    if (s.visible) return;
    ctx.globalAlpha = 0.15;
    ctx.beginPath();
    s.points.forEach((p,j)=>{const sx=(p.x-minX)*sc,sy=(p.y-minY)*sc;j===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);});
    ctx.closePath();
    ctx.strokeStyle = s.color; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // ── Bounding box del slice activo ──
  if (activeIdx >= 0 && activeIdx < slices.length) {
    const s = slices[activeIdx];
    const xs = s.points.map(p=>p.x), ys = s.points.map(p=>p.y);
    const bx0=(Math.min(...xs)-minX)*sc, by0=(Math.min(...ys)-minY)*sc;
    const bx1=(Math.max(...xs)-minX)*sc, by1=(Math.max(...ys)-minY)*sc;
    const bw=bx1-bx0, bh=by1-by0;
    const col = s.color;

    // dashed rect
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.setLineDash([4,3]);
    ctx.strokeRect(bx0, by0, bw, bh);
    ctx.restore();

    // corner handles
    const hs = 5;
    [[bx0,by0],[bx1,by0],[bx1,by1],[bx0,by1]].forEach(([hx,hy]) => {
      ctx.fillStyle = '#1a1d1a';
      ctx.fillRect(hx-hs/2, hy-hs/2, hs, hs);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.setLineDash([]);
      ctx.strokeRect(hx-hs/2, hy-hs/2, hs, hs);
    });

    // dimension labels
    const outW = parseFloat(document.getElementById('opt-w').value)||svgVB.w;
    const outH = parseFloat(document.getElementById('opt-h').value)||svgVB.h;
    const realW = Math.round((Math.max(...xs)-Math.min(...xs)) * outW/svgVB.w);
    const realH = Math.round((Math.max(...ys)-Math.min(...ys)) * outH/svgVB.h);
    ctx.fillStyle = col;
    ctx.font = `500 9px 'JetBrains Mono',monospace`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(`${realW}px`, bx0+bw/2, by0-4);
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`${realH}px`, bx1+5, by0+bh/2);
  }

  // ── Overlay de resolución ──
  if (showOverlay) {
    const outW = parseFloat(document.getElementById('opt-w').value)||svgVB.w;
    const outH = parseFloat(document.getElementById('opt-h').value)||svgVB.h;
    const aspect = outW/outH;
    const fw = Math.min(cW, cH * aspect);
    const fh = fw / aspect;
    const fx = (cW-fw)/2, fy = (cH-fh)/2;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
    ctx.setLineDash([6,4]);
    ctx.strokeRect(fx+.5, fy+.5, fw-1, fh-1);
    // corner marks
    ctx.setLineDash([]); ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
    const cm=10;
    [[fx,fy],[fx+fw,fy],[fx+fw,fy+fh],[fx,fy+fh]].forEach(([ox,oy],ci)=>{
      const sx=ci===0||ci===3?1:-1, sy=ci<2?1:-1;
      ctx.beginPath(); ctx.moveTo(ox+sx*cm,oy); ctx.lineTo(ox,oy); ctx.lineTo(ox,oy+sy*cm); ctx.stroke();
    });
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.font=`500 9px 'JetBrains Mono',monospace`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(`${Math.round(outW)} × ${Math.round(outH)} px`, fx+6, fy+6);
  }

  document.getElementById('preview-dim').textContent = `${Math.round(dW)} × ${Math.round(dH)} px`;
}

function toggleOverlay() {
  showOverlay = !showOverlay;
  renderPreview();
}

// ══════════════════════════════════════════════
//  INTERACTIONS
// ══════════════════════════════════════════════
function removeSlice(e, i) {
  e.stopPropagation(); slices.splice(i,1);
  if (activeIdx >= slices.length) activeIdx = slices.length-1;
  renderList(); renderPreview();
  if (!slices.length) {
    document.getElementById('btn-export').disabled = true;
    setStatus('Sin slices. Importa un SVG.','');
  } else {
    setStatus(`${slices.length} slice${slices.length!==1?'s':''} restantes.`,'ok');
  }
}

function clearAll() {
  slices=[]; activeIdx=-1; showOverlay=false;
  renderList(); renderPreview();
  document.getElementById('btn-export').disabled = true;
  document.getElementById('file-input').value = '';
  setStatus('Importa un SVG para comenzar.','');
}

// ══════════════════════════════════════════════
//  EXPORT DROPDOWN
// ══════════════════════════════════════════════
function toggleExportMenu() {
  document.getElementById('export-menu').classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.export-wrap'))
    document.getElementById('export-menu').classList.remove('open');
});

function doExport(mode) {
  document.getElementById('export-menu').classList.remove('open');
  if (!slices.length) { setStatus('No hay slices para exportar.','err'); return; }
  const vis = slices.filter(s => s.visible);
  if (!vis.length) { setStatus('Todos los slices están ocultos.','err'); return; }

  const outW   = parseFloat(document.getElementById('opt-w').value)||svgVB.w;
  const outH   = parseFloat(document.getElementById('opt-h').value)||svgVB.h;
  const scaleX = outW/svgVB.w, scaleY = outH/svgVB.h;
  let uidBase  = Date.now();
  const uid    = () => String(uidBase++);

  if (mode === 'screensetup') buildScreenSetup(vis, outW, outH, scaleX, scaleY, uid);
  else                         buildCompositionPreset(vis, outW, outH, scaleX, scaleY, uid);
}

// ══════════════════════════════════════════════
//  XML HELPERS
// ══════════════════════════════════════════════
function prRange(name, val, min, max, tabs=6) {
  const t='\t'.repeat(tabs), t1='\t'.repeat(tabs+1);
  return `${t}<ParamRange name="${name}" T="DOUBLE" default="${val}" value="${val}">
${t1}<PhaseSourceStatic name="PhaseSourceStatic"/>
${t1}<BehaviourDouble name="BehaviourDouble"/>
${t1}<ValueRange name="defaultRange" min="${min}" max="${max}"/>
${t1}<ValueRange name="minMax" min="${min}" max="${max}"/>
${t1}<ValueRange name="startStop" min="${min}" max="${max}"/>
${t}</ParamRange>`;
}

function makeSliceXML(s, scaleX, scaleY, uid) {
  const xs=s.points.map(p=>r2(p.x*scaleX));
  const ys=s.points.map(p=>r2(p.y*scaleY));
  const x0=Math.min(...xs),y0=Math.min(...ys);
  const x1=Math.max(...xs),y1=Math.max(...ys);
  const w=x1-x0,h=y1-y0;
  const v4=`\t\t\t\t\t\t\t<v x="${r2(x0)}" y="${r2(y0)}"/>
\t\t\t\t\t\t\t<v x="${r2(x1)}" y="${r2(y0)}"/>
\t\t\t\t\t\t\t<v x="${r2(x1)}" y="${r2(y1)}"/>
\t\t\t\t\t\t\t<v x="${r2(x0)}" y="${r2(y1)}"/>`;
  let bv='';
  for(let row=0;row<4;row++)for(let col=0;col<4;col++)
    bv+=`\t\t\t\t\t\t\t\t<v x="${r2(x0+w*(col/3))}" y="${r2(y0+h*(row/3))}"/>\n`;
  return `\t\t\t\t\t<Slice uniqueId="${uid()}">
\t\t\t\t\t\t<Params name="Common">
\t\t\t\t\t\t\t<Param name="Name" T="STRING" default="Layer" value="${xe(s.name)}"/>
\t\t\t\t\t\t\t<Param name="Enabled" T="BOOL" default="1" value="1"/>
\t\t\t\t\t\t</Params>
\t\t\t\t\t\t<Params name="Input">
\t\t\t\t\t\t\t<ParamChoice name="Input Source" default="0:1" value="0:1" storeChoices="0"/>
\t\t\t\t\t\t\t<Param name="Input Opacity" T="BOOL" default="1" value="1"/>
\t\t\t\t\t\t\t<Param name="Input Bypass/Solo" T="BOOL" default="1" value="1"/>
\t\t\t\t\t\t\t<Param name="SoftEdgeEnable" T="BOOL" default="0" value="0"/>
\t\t\t\t\t\t</Params>
\t\t\t\t\t\t<Params name="Output">
\t\t\t\t\t\t\t<Param name="Flip" T="UINT8" default="0" value="0"/>
${prRange('Brightness',0,-1,1)}
${prRange('Contrast',0,-1,1)}
${prRange('Red',0,-1,1)}
${prRange('Green',0,-1,1)}
${prRange('Blue',0,-1,1)}
\t\t\t\t\t\t\t<Param name="Is Key" T="BOOL" default="0" value="0"/>
\t\t\t\t\t\t\t<Param name="Black BG" T="BOOL" default="0" value="0"/>
${prRange('BRed',0,0,'0.4000000000000000222')}
${prRange('BGreen',0,0,'0.4000000000000000222')}
${prRange('BBlue',0,0,'0.4000000000000000222')}
\t\t\t\t\t\t</Params>
\t\t\t\t\t\t<InputRect orientation="0">
${v4}
\t\t\t\t\t\t</InputRect>
\t\t\t\t\t\t<OutputRect orientation="0">
${v4}
\t\t\t\t\t\t</OutputRect>
\t\t\t\t\t\t<Warper>
\t\t\t\t\t\t\t<Params name="Warper">
\t\t\t\t\t\t\t\t<ParamChoice name="Point Mode" default="PM_LINEAR" value="PM_LINEAR" storeChoices="0"/>
\t\t\t\t\t\t\t\t<Param name="Flip" T="UINT8" default="0" value="0"/>
\t\t\t\t\t\t\t</Params>
\t\t\t\t\t\t\t<BezierWarper controlWidth="4" controlHeight="4">
\t\t\t\t\t\t\t\t<vertices>
${bv}\t\t\t\t\t\t\t\t</vertices>
\t\t\t\t\t\t\t</BezierWarper>
\t\t\t\t\t\t\t<Homography>
\t\t\t\t\t\t\t\t<src>
${v4}
\t\t\t\t\t\t\t\t</src>
\t\t\t\t\t\t\t\t<dst>
${v4}
\t\t\t\t\t\t\t\t</dst>
\t\t\t\t\t\t\t</Homography>
\t\t\t\t\t\t</Warper>
\t\t\t\t\t</Slice>`;
}

function screenBlock(vis, outW, outH, scaleX, scaleY, uid, tabDepth=3) {
  const td = '\t'.repeat(tabDepth);
  const screenId = uid();
  const layers = vis.map(s => makeSliceXML(s, scaleX, scaleY, uid)).join('\n');
  return `${td}<Screen name="${xe(svgFileName)}" uniqueId="${screenId}">
${td}\t<Params name="Params">
${td}\t\t<Param name="Name" T="STRING" default="" value="${xe(svgFileName)}"/>
${td}\t\t<Param name="Enabled" T="BOOL" default="1" value="1"/>
${td}\t\t<Param name="Hidden" T="BOOL" default="0" value="0"/>
${td}\t</Params>
${td}\t<Params name="Output">
${prRange('Opacity',1,0,1,tabDepth+2)}
${prRange('Brightness',0,-1,1,tabDepth+2)}
${prRange('Contrast',0,-1,1,tabDepth+2)}
${prRange('Red',0,-1,1,tabDepth+2)}
${prRange('Green',0,-1,1,tabDepth+2)}
${prRange('Blue',0,-1,1,tabDepth+2)}
${td}\t</Params>
${td}\t<guides>
${td}\t\t<ScreenGuide name="ScreenGuide" type="0">
${td}\t\t\t<Params name="Params">
${td}\t\t\t\t<ParamPixels name="Image"/>
${prRange('Opacity',0.25,0,1,tabDepth+4)}
${td}\t\t\t</Params>
${td}\t\t</ScreenGuide>
${td}\t\t<ScreenGuide name="ScreenGuide" type="1">
${td}\t\t\t<Params name="Params">
${td}\t\t\t\t<ParamPixels name="Image"/>
${prRange('Opacity',0.25,0,1,tabDepth+4)}
${td}\t\t\t</Params>
${td}\t\t</ScreenGuide>
${td}\t</guides>
${td}\t<layers>
${layers}
${td}\t</layers>
${td}\t<OutputDevice>
${td}\t\t<OutputDeviceVirtual name="${xe(svgFileName)}" deviceId="VirtualScreen 1" idHash="10094742552620344504" width="${outW}" height="${outH}">
${td}\t\t\t<Params name="Params">

function download(xml, filename) {
  const blob=new Blob([xml],{type:'application/xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function sanitize(s,i){const c=String(s).replace(/[^a-zA-Z0-9_\-]/g,'_').replace(/^_+|_+$/g,'');return c||`SCREEN_${String(i+1).padStart(2,'0')}`;}
function xe(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function r2(n){return Math.round(n*100)/100;}
function setStatus(msg,type=''){const el=document.getElementById('status');el.textContent=msg;el.className=type;}

window.addEventListener('resize',()=>{if(slices.length)renderPreview();});
